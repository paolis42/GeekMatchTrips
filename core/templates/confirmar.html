<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Eliminar registro</title>
</head>
<body>

    <h1>Eliminar registro</h1>

    <p>
        ¿Seguro que quieres eliminar
        <strong>{{ registro.nombre_lugar }}</strong>?
    </p>

    <form method="POST">
        {% csrf_token %}
        <button type="submit">Sí, eliminar</button>
    </form>

    <br>

    <a href="{% url 'lista' %}">Cancelar</a>

</body>
</html>
